<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 无障碍（10-30）：移除 maximum-scale/user-scalable=no，允许低视力用户双指缩放（Apple HIG / WCAG 1.4.4） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FBF8F1" />
    <meta name="description" content="D-Bee（自律蜜蜂）- AI 拍照识别食物热量，帮你管好每一餐" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="D-Bee" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>D-Bee · 自律蜜蜂</title>
  </head>
  <body>
    <!--
      启动失败自报面板（2026-10-31 加，iOS 真机白屏排障的血泪教训）。

      为什么必须有它：
        本项目所有 web 资源在原生包里是**本地文件**（capacitor://localhost），
        任何模块级 throw 都不会有网络报错、不会有弹窗，只会让 React 挂载不上去
        —— 表现就是「纯白/米白屏，状态栏正常，无任何提示」（CSS 已加载所以偏米白）。
        10-30 那次白屏（npm run build 被 cloudConfig fail-closed 护栏击中）
        花了 45 分钟才用「构建产物 grep 对照」倒推出根因；而真机侧无法挂调试器，
        Windows 开发机也编不了 Swift —— 排障只能靠猜。

      它做什么：
        在任何业务 JS 之前，用零依赖的内联脚本挂上四类捕获，把错误**直接画在屏幕上**，
        用户拍张照就能拿到确切根因：
          ① window.onerror            模块求值期 / 运行期未捕获异常（含 stack）
          ② unhandledrejection         异步链里的静默失败
          ③ error(capture=true)        script/css/img 等资源 404 或加载失败
          ④ 5 秒兜底                   无任何报错但 #root 仍为空 = React 没挂载
        另外打印 href（区分 capacitor://localhost 与 https://localhost）、
        UA、#root 子节点数、以及实际加载的 JS 文件名（带 hash，可判断装的是哪次产物）。

      约束：
        · 必须用 ES5 语法 + 内联，不能 import 任何模块 —— 它要在业务 JS 之前就能跑，
          且业务 JS 本身可能就是出错源。
        · 面板挂到 documentElement 而非 body，z-index 顶格：React 重渲染/卸载都冲不掉它。
        · 正常启动时零副作用（不创建任何 DOM、不改样式）。
        · 2026-11-01 起分两种形态（实战教训：登录后 IAP 异步异常曾把**可用** App
          整屏盖成红屏）：
            - 启动期/渲染期（fatal）→ 整屏接管，此时 App 本来就不可用；
            - 运行期非致命（#root 已有子节点）→ 顶部横幅 + 关闭按钮，
              错误照样可截图上报，但不阻断使用。
        · padding-top 叠加 env(safe-area-inset-top)：刘海机上标题行曾被状态栏压住，
          截图 OCR 读不出最关键的错误类型。
      详见 docs/今晚-Mac编译执行手册.md §五-5「白屏排障」。
    -->
    <script>
      (function () {
        var fired = false

        // 公共样式。🔴 padding-top 必须叠加 env(safe-area-inset-top)：
        //   2026-11-01 实战踩坑 —— 原为固定 top:0 + padding 16px，iPhone 刘海机上
        //   标题行「【D-Bee 启动自报】」正好压在状态栏底下，截图 OCR 怎么都读不出
        //   最关键的一行（错误类型），只能靠栈帧反推。viewport-fit=cover 已在 head 设置。
        var BASE_STYLE =
          'position:fixed;top:0;left:0;right:0;z-index:2147483647;overflow:auto;' +
          'box-sizing:border-box;background:#FCEBEB;color:#791F1F;' +
          'font:12px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;' +
          'white-space:pre-wrap;word-break:break-all;text-align:left;-webkit-text-size-adjust:100%;' +
          'padding:calc(14px + env(safe-area-inset-top,0px)) 14px ' +
          'calc(20px + env(safe-area-inset-bottom,0px));'
        // 启动期（React 没挂上）：整屏接管 —— 此时 App 本来就不可用。
        var FULL_STYLE = BASE_STYLE + 'bottom:0;'
        // 🔴 运行期（React 已挂载）：只压顶部横幅，不整屏盖死。
        //   2026-11-01 实战踩坑 —— 用户登录后 App 完全可用，仅 IAP 后台恢复链路
        //   抛了个异步异常，旧逻辑却把整个界面盖成红屏，等于「非致命错误把可用
        //   App 变成不可用」。横幅模式保留错误信息（照样能截图），同时让用户
        //   能关掉继续用。
        var BANNER_STYLE =
          BASE_STYLE +
          'bottom:auto;max-height:52vh;border-bottom:2px solid #791F1F;' +
          'box-shadow:0 2px 14px rgba(121,31,31,.28);'

        function panel() {
          var p = document.getElementById('dbee-boot-error')
          if (p) return p
          p = document.createElement('div')
          p.id = 'dbee-boot-error'
          p.setAttribute('style', FULL_STYLE)
          document.documentElement.appendChild(p)
          return p
        }

        /** React 是否已挂载（= App 本身可用，错误属运行期非致命） */
        function appAlive() {
          var root = document.getElementById('root')
          return !!(root && root.childElementCount > 0)
        }

        function env() {
          var srcs = []
          var tags = document.getElementsByTagName('script')
          for (var i = 0; i < tags.length; i++) {
            if (tags[i].src) srcs.push(tags[i].src.replace(location.origin, ''))
          }
          var root = document.getElementById('root')
          return (
            '\n\n──── 环境快照 ────\n' +
            'href: ' + location.href + '\n' +
            'root 子节点: ' + (root ? root.childElementCount : '(无 #root)') + '\n' +
            'script: ' + (srcs.join(', ') || '(无)') + '\n' +
            'ua: ' + navigator.userAgent
          )
        }

        /**
         * @param {string} kind  错误类型（显示在 ▸ 之后）
         * @param {string} detail 详情/栈
         * @param {boolean} [fatal] 显式指定致命性。
         *   不传则按「React 是否已挂载」自动判断：已挂载 = App 可用 = 非致命横幅。
         *   🔴 React 渲染期抛错必须显式传 true：此时 #root 里仍有子节点
         *     （错误边界渲染了兜底 UI），自动判断会误判成「App 可用」，
         *     而实际上整个界面已经废了。
         */
        function show(kind, detail, fatal) {
          fired = true
          var isFatal = typeof fatal === 'boolean' ? fatal : !appAlive()
          var p = panel()
          p.setAttribute('style', isFatal ? FULL_STYLE : BANNER_STYLE)

          var head = isFatal
            ? '【D-Bee 启动自报】请把本页截图发给开发者\n'
            : '【D-Bee 运行期异常】App 仍可继续使用，请把本页截图发给开发者\n'
          var box = document.createElement('div')
          box.textContent = head + '\n▸ ' + kind + '\n\n' + (detail || '(无详情)') + env()

          p.textContent = ''
          p.appendChild(box)

          // 横幅模式给一个关闭按钮：非致命错误不该把用户锁在红屏上。
          // 关闭后 fired 仍为 true，5 秒兜底不会重复弹出。
          if (!isFatal) {
            var btn = document.createElement('button')
            btn.type = 'button'
            btn.textContent = '✕ 我知道了，继续使用 App'
            btn.setAttribute(
              'style',
              'display:block;margin-top:14px;padding:11px 16px;border:0;border-radius:9px;' +
                'background:#791F1F;color:#FCEBEB;font:14px/1.2 -apple-system,sans-serif;'
            )
            btn.onclick = function () {
              p.style.display = 'none'
            }
            p.appendChild(btn)
          }
        }

        // 供 React 错误边界（src/components/BootErrorBoundary.tsx）复用同一面板。
        // 第三参 true = 致命（整屏接管）：渲染期抛错意味着界面已不可用。
        window.__dbeeShowBootError = function (msg) {
          show('React 渲染期抛错', msg, true)
        }

        window.onerror = function (msg, src, line, col, err) {
          show('脚本未捕获异常: ' + msg, (err && err.stack) || '位置: ' + src + ':' + line + ':' + col)
          return false
        }

        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason
          show('未处理的 Promise 拒绝', (r && (r.stack || r.message)) || String(r))
        })

        // capture 阶段才能收到资源加载错误（资源错误不冒泡）
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target
            if (t && t !== window && (t.src || t.href)) {
              show('资源加载失败', (t.tagName || '?') + ' → ' + (t.src || t.href))
            }
          },
          true
        )

        // 兜底：没有报错，但 React 就是没挂上去（例如入口路径不对、CSS 遮挡、
        // 模块被死代码消除成空）。这类白屏最隐蔽，只能靠超时探测。
        setTimeout(function () {
          if (fired) return
          var root = document.getElementById('root')
          if (!root || root.childElementCount === 0) {
            show(
              'React 未挂载（5 秒内 #root 仍为空，且无任何 JS 报错）',
              '排查方向：① 产物是否用 build:native / build:native:internal 打的\n' +
                '② cap sync 是否把 dist 同步进了 ios/App/App/public\n' +
                '③ 入口 index.html 引用的 assets 文件名是否与实际产物一致'
            )
          }
        }, 5000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
