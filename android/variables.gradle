ext {
    // 🔴 2026-11-18 用户拍板：24 → 26（放弃 Android 7.0/7.1）。
    // 原因：androidx.health.connect:connect-client 稳定版 1.1.0 要求 minSdk 26；
    // 支持 24 的只有 1.2.0-alpha 系列（API 可能变动、无稳定性承诺），稳定版优先。
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // 🔴 Kotlin 版本 = **全构建共享**：@capacitor/camera、filesystem、local-notifications
    // 三个官方插件的 buildscript 都读 `rootProject.ext.kotlin_version`（下划线命名），
    // 未定义时各自回落默认 '2.2.20'。故此处必须用 **kotlin_version（下划线）** 统一定义，
    // 否则同构建内出现两个 Kotlin 版本 → classpath 被解析抬高 → 上游插件被迫用未验证版本编译。
    // 选 2.2.20 的理由（2026-11-18 实证）：① 与三个官方插件默认值**完全一致**（零版本分裂）
    // ② 官方插件已在生产验证「2.2.20 + AGP 8.13.0 + JDK 21 + compileSdk 36」组合
    // ③ 本地 Gradle 缓存已有，构建不受网络波动影响。
    // ⚠️ 曾拍板 2.3.0（D-E），实证后修正为 2.2.20：HC 只需 suspend 支持（Kotlin 1.x 起即有），
    //    版本号更新对功能零收益，却会抬升上游插件编译版本 → 风险大于收益。
    kotlin_version = '2.2.20'
    kotlinCoroutinesVersion = '1.10.2'
    // Health Connect 稳定版（非 alpha）；要求 minSdk 26、设备 Android 9(API 28)+。
    // API 签名已于 2026-11-18 用 javap 反编译 AAR 实证（getSdkStatus 1/2/3、
    // provider=com.google.android.apps.healthdata、aggregate(AggregateRequest)、
    // StepsRecord.COUNT_TOTAL / ActiveCaloriesBurnedRecord.ACTIVE_CALORIES_TOTAL）。
    healthConnectVersion = '1.1.0'
    // 支付宝 App 支付 SDK（2026-11-20 接入，方案 A 双渠道齐上 → 路线①自写本地插件）。
    // 🔴 必须钉死精确版本，**不得**写成 `+`（如 `alipaysdk-android:+@aar`）：
    //    动态版本每次构建都可能拉到不同二进制 → 产物不可复现、出问题无法回溯是哪版，
    //    且等于把供应链决定权交给上游（社区插件 @foskym/capacitor-alipay 正是这么写的，
    //    这也是本项目选择自写 @dbee/alipay 的四条理由之一）。
    // 版本选定依据（2026-11-20 实证，非凭记忆）：
    //    ① Maven Central maven-metadata.xml → <release>15.8.42</release>（lastUpdated 20260512）
    //    ② 下载该版 AAR（460688 bytes）反编译：javap 实证
    //       `public synchronized java.util.Map<String,String> payV2(java.lang.String, boolean)`
    //       —— 与 src/lib/payment/alipay.ts 适配层约定的三字段返回形态一致
    //       （resultStatus / result / memo；本版本**已无** PayResult 类，只能走 Map）
    //    ③ AAR 自带 AndroidManifest 已声明 <queries>（com.eg.android.AlipayGphone 等 4 个包名）
    //       与 4 个 Activity（H5PayActivity/H5AuthActivity/PayResultActivity/AlipayResultActivity），
    //       由 manifest merger 自动合并 → 插件侧无需重复声明（与 HC 需自己补 <queries> 相反）
    //    ④ AAR 的 proguard.txt 是 consumerProguardFiles（文件内已注明「自动附加」）→
    //       宿主开启 minify 时 keep 规则自动生效，无需手写；当前宿主 minifyEnabled false
    //    ⑤ SDK minSdkVersion=21 ≤ 本项目 26，无版本冲突
    //    ⑥ 供应链校验：POM 声明 <packaging>aar</packaging> 且**零传递依赖** →
    //       依赖串无需 `@aar` 后缀；本地下载 AAR 的 sha256 与 Maven Central 公布的
    //       .aar.sha256 **逐字一致** = a6c301708b59a3a7cda843cf02e7b3b0b44afd96819f0a18890322e9868abf28
    //       （日后升级版本时按同样方式复核，防镜像污染 / 中间人替换）
    alipaySdkVersion = '15.8.42'
}