        getPlatform: function () { return 'android' },
        isNativePlatform: function () { return true },
        platform: 'android',
        Plugins: {
          CapacitorWechat: {
            initialize: function () { return Promise.resolve() },
            isInstalled: function () { return Promise.resolve({ installed: true }) },
            sendPaymentRequest: function () { return Promise.resolve() },
